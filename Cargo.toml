[package]
name = "ephemerust"
version = "0.2.0"
edition = "2021"
authors = ["MichaelHansen"]
description = "Astronomy, orbital-mechanics, and satellite-tracking toolkit and library, written in Rust"
license = "MIT"
repository = "https://github.com/IsomorphicAlgo/ephemerust"
keywords = ["astronomy", "orbital-mechanics", "satellite", "ephemeris", "sgp4"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sgp4 = "2.4.0"

[dev-dependencies]
criterion = "0.5"
