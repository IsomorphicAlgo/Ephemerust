[package]
name = "ephemerust"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["Michael Hansen"]
description = "An accessible, teaching-grade astronomy, orbital-mechanics, and satellite-tracking library and CLI for Rust"
license = "MIT"
repository = "https://github.com/IsomorphicAlgo/ephemerust"
documentation = "https://docs.rs/ephemerust"
readme = "readme.md"
# crates.io discoverability. Keywords (max 5) favor search terms NOT already in the name or
# description ("orbital-mechanics" is in the description, so its slot goes to "tle").
# Categories (max 5) must come from the official slug list: https://crates.io/category_slugs
keywords = ["astronomy", "tle", "satellite", "ephemeris", "sgp4"]
categories = ["aerospace", "aerospace::simulation", "science", "command-line-utilities"]

# docs.rs should document the optional `net` module too.
[package.metadata.docs.rs]
all-features = true

[features]
default = []
# HTTPS TLE fetch: enables the `net` library module and the `track` CLI flag `--tle-url`.
# Pulls the minimal blocking HTTP client `ureq` (rustls TLS). See http_plan.md.
network = ["dep:ureq"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sgp4 = "2.4.0"
ureq = { version = "3.3.0", optional = true }

[dev-dependencies]
criterion = "0.7"
# Used by integration tests (`tests/cli_track.rs`) for JSON assertions.
serde_json = "1.0"

[[bench]]
name = "core_operations"
harness = false
